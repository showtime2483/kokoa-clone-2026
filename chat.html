<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat w/k - Kokoa Clone</title>
</head>
<body id="chat-screen">
    <div class="status-bar">
        <div class="status-bar_column">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar_column">
            <span>18:43</span>
        </div>
        <div class="status-bar_column">
            <span>110%</span>
            <i class="fa-solid fa-battery-full fa-lg"></i>
            <i class="fa-solid fa-bolt-lightning"></i>
        </div>
    </div>  
    <header class="alt-header">
        <div class="alt-header_columns">
            <a href="chats.html">
                <i class="fa-solid fa-angle-left fa-2x"></i></a>
        </div>
        <div class="alt-header_columns">
            <h1 class="alt-header_title">미진이
                <i class="fa-solid fa-heart pink-icon"></i>
            </h1>
        </div>
        <div class="alt-header_columns">
            <span><i class="fa-solid fa-magnifying-glass fa-2x"></i></span>
            <span><i class="fa-solid fa-bars fa-2x"></i></span>
        </div>
    </header>
    <main class="main-screen main-chat">
        <div class="chat_timestamp">
            Tuesday, June 30. 2020
        </div>
        <div class="message-row">
            <img src="screenshot/MJMJ.jpg" />
            <div class="message-row_content">
                <span class="message_author">미진이<i class="fa-solid fa-heart pink-icon"></i></span>
                <div class="message_info">
                    <span class="message_bubble">Hi~~!!</span>
                    <span class="message_time">21:27</span>
                </div>
            </div>
        </div>

        <div class="message-row message-row-own">
                <div class="message-row_content">
                    <div class="message_info">
                        <span class="message_bubble">Long time no see!!</span>
                        <span class="message_time">21:27</span>
                    </div>
                </div>
            </div>
    </main>
    <form class="reply">
        <div class="reply_column">
            <i class="fa-regular fa-square-plus fa-2xl"></i>
        </div>
        <div class="reply_column">
            <input type="text" placeholder="Writer a message...">
            <i class="fa-regular fa-face-grin-hearts fa-2xl"></i>
            <button>
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
    </form>
    <div id="no-mobile">
        <span>Your screen is too bigㅠㅠ</span>
    </div>
    <script src="https://kit.fontawesome.com/076ca2403e.js" crossorigin="anonymous">
    </script>
</body>
</html>

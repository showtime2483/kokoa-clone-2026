<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends - Kokoa Clone</title>
</head>
<body>
    <div class="status-bar">
        <dQiv class="status-bar_column">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar_column">
            <span>18:43</span>
        </div>
        <div class="status-bar_column">
            <span>110%</span>
            <i class="fa-solid fa-battery-full fa-lg"></i>
            <i class="fa-solid fa-bolt-lightning"></i>
        </div>
    </div>  
    <header class="screen-header">
        <h1 class="screen-header_title">Frineds</h1>
        <div class="screen-header_icons">
            <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
            <span><i class="fa-solid fa-music fa-lg"></i></span>
            <span><i class="fa-solid fa-gear fa-lg"></i></span>
        </div>
    </header>
    <a id="friends-display-link"><i class="fa-solid fa-circle-info"></i>
        Frined's Names Display 
        <i class="fa-solid fa-chevron-right fa-xs"></i>
    </a>
    <main class="friends-screen">
        <div class="user-component">
            <div class="user-component_column">
                <img src="screenshot/imgimg.png" class="user-component_avatar_xl_screenshot"/>
                <div class="user-component_text">
                    <h4 class="user-component_title">Kangil</h4>
                    <!--<h6 class="user-component_subtitle">this text is test</h6>-->
                </div>
            </div>
        </div>
        <div class="friends-screen-channel">
            <div class="friends-screen-channel_header">
                <span>Channel</span>
                <i class="fa-solid fa-chevron-up fa-xs"></i>
            </div>
        </div>
        <div class="user-component">
            <div class="user-component_column">
                <img src="screenshot/imgimg.png" class="user-component_avatar_sm_screenshot"/>
                <div class="user-component_text">
                    <h4 class="user-component_title_not-bold">Channel</h4>
                </div>
            </div>
            <div class="user-component_column">
                <div>
                    <span>2</span>
                    <i class="fa-solid fa-chevron-right fa-xs"></i>
                </div>
            </div>
        </div>
    </main>
    <nav class="nav">
        <ul class="nav_list">
            <li class="nav_btn">
                <a class="nav_link" href="friends.html">
                    <i class="fa-solid fa-user fa-2xl"></i>
            </a>
            </li>
            <li class="nav_btn">
                <a class="nav_link" href="chats.html">
                    <span class="nav_notification badge">1</span>
                    <i class="fa-regular fa-comment fa-2xl"></i>
                </a>
            </li>
            <li class="nav_btn">
                <a class="nav_link" href="find.html">
                    <i class="fa-solid fa-magnifying-glass fa-2xl"></i>
                </a>
            </li>
            <li class="nav_btn">
                <a class="nav_link" href="more.html">
                    <div class="nav_notification2"></div>
                    <i class="fa-solid fa-ellipsis fa-2xl"></i>
                </a>
            </li>
        </ul>
    </nav>
    <div id="splash-screen">
        <i class="fa-solid fa-comment fa-2xl"></i>
    </div>
    <div id="no-mobile">
        <span>Your screen is too bigㅠㅠ</span>
    </div>
    
    <script src="https://kit.fontawesome.com/076ca2403e.js" crossorigin="anonymous">
    </script>
</body>
</html>
